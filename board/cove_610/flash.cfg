# Cove-610 SPI NAND layout (2 KiB page, 128 KiB block).
# Sourced by post-image.sh; sizes are in bytes.
#
# ROOTFS_SIZE must stay in step with BR2_TARGET_ROOTFS_UBIFS_MAXLEBCNT
# (ROOTFS_SIZE / 128 KiB) in the defconfig.
CHIP=hi3516cv610
NAND_PAGE=2k
NAND_BLOCK=128k
BOOT_SIZE=$((512 * 1024))
ENV_SIZE=$((512 * 1024))
KERNEL_SIZE=$((4 * 1024 * 1024))
ROOTFS_SIZE=$((59 * 1024 * 1024))
# Size of the environment image itself (CONFIG_ENV_SIZE in U-Boot).
ENV_IMAGE_SIZE=0x40000
